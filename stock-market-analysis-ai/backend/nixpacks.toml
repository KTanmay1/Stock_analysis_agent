[phases.setup]
nixPkgs = ["python39"]

[phases.install]
cmds = [
  "pip install --no-cache-dir --upgrade pip",
  "pip install --no-cache-dir fastapi uvicorn[standard] python-dotenv",
  "pip install --no-cache-dir requests beautifulsoup4 feedparser trafilatura lxml_html_clean",
  "pip install --no-cache-dir numpy pandas yfinance",
  "pip install --no-cache-dir plotly groq"
]

[phases.build]
cmds = ["echo 'Build phase completed'"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
