version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: stock-analysis-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: stock-analysis-frontend-streamlit
    ports:
      - "8501:8501"
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    restart: unless-stopped

  frontend-react:
    build:
      context: ./frontend-react
      args:
        # Use localhost for browser access from host machine
        VITE_BACKEND_URL: http://localhost:8000
    container_name: stock-analysis-frontend-react
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
